name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - name: Validate release artifacts and tag version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python -m scripts.check_artifacts --dist-dir dist --release-tag "$RELEASE_TAG"
      - run: python -m twine check --strict dist/*
      - name: Smoke-test the installed wheel
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -I -c 'from io import StringIO; from yaml_compose import load_yaml_compose; assert load_yaml_compose(StringIO("items: [before, !spread [[one, two]], after]\n")) == {"items": ["before", "one", "two", "after"]}'
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/yaml-compose/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
